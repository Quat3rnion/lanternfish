[package]
name = "lanternfish"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Trace and visualize how a llama.cpp model routes each token through its layers and experts"
readme = "README.md"
keywords = ["llama-cpp", "interpretability", "logit-lens", "mixture-of-experts", "gguf"]
license = "Apache-2.0"
repository = "https://github.com/Quat3rnion/lanternfish"

[features]
default = ["ui"]
ui = ["dep:axum", "dep:mime_guess", "dep:rust-embed", "dep:tokio"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive", "env"] }
matrixmultiply = "0.3"
memmap2 = "0.9"
mime_guess = { version = "2", optional = true }
rayon = "1"
regex = "1"
rust-embed = { version = "8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "fs", "net"], optional = true }

[build-dependencies]
bindgen = "0.72"

[profile.release]
opt-level = 3
debug = false
